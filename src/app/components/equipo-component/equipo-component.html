<h1>Equipos</h1>
<div class="d-flex flex-row">
  @for (team of equipos; track team){
    <div class="card m-2" style="width: 18rem;">
      <img src="{{team.imagen}}" class="card-img-top" alt="Imagen del equipo">
      <div class="card-body">
        <h5 class="card-title">{{team.nombre}}</h5>
        <p class="card-text">{{team.descripcion}}</p>
      </div>
    </div>
  }
</div>
